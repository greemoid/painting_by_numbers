[package]
name = "rust_lib_paiting_by_numbers"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
image = "0.24"
imageproc = "0.23"
rkm = "0.7"
ndarray = "0.12"
vtracer = "0.6"
visioncortex = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored = "2.1"
rand = "0.8"
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
